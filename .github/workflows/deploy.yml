name: Deploy Angular to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build -- --configuration production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::543704476224:role/github-actions-deploy
          aws-region: ap-southeast-1

      - name: Deploy to S3
        run: aws s3 sync dist/devkit-platform-web/browser s3://devkit-platform.20baht.com --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E39KWIIZ9G5T8Z --paths "/*"
